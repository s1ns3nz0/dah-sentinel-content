id: 00000000-0000-0000-0000-000000000001
name: TemplateHuntingQuery
displayName: "[TEMPLATE] Hunting query template"
description: |
  탐지 룰이 아닌 능동 헌팅 쿼리. 룰로 자동 알람 띄우지 않고, 분석가가 정기적으로 실행.

  [Goal] 이 쿼리로 찾으려는 것을 한 문장으로.
  [Strategy Abstract] 어떤 로그를 어떤 논리로 훑는다.
  [Blind Spots & Assumptions] 이 쿼리가 놓치는 조건 / 전제.
  [Validation] 결과가 유의미한지 확인하는 방법 (예: 알려진 정상 케이스 대비 비교).
tactics:
  - Reconnaissance
techniques:
  - T1592
tags:
  - dah
  - uav
  - template
query: |
  UAVOperator_CL
  | where TimeGenerated > ago(7d)
  | where ActionName == "arm_disarm"
  | summarize ArmCount = count() by SourceSystemId, bin(TimeGenerated, 1d)
  | order by ArmCount desc
version: 1.0.0
